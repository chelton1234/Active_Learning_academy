<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Learning Academy – Solicitar explicador</title>
  <link rel="stylesheet" href="Css/FichaAluno.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<button id="openModalBtn" class="open-modal-btn">
  <i class="fas fa-chalkboard-user"></i> Solicitar explicador
</button>

<div id="infoModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2 class="modal-title" data-pt="📋 Solicitar um explicador" data-en="📋 Request a tutor">📋 Solicitar um explicador</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>

    <div class="modal-body">
      <div class="language-container">
        <div class="language-selector" id="languageSelector">
          <button class="language-btn">
            <span class="flag-icon" id="currentFlag">🇵🇹</span>
            <span class="language-code" id="currentLang">PT</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="language-dropdown">
            <a href="#" class="language-item active" data-lang="pt"><span class="flag-icon">🇵🇹</span>Português</a>
            <a href="#" class="language-item" data-lang="en"><span class="flag-icon">🇬🇧</span>English</a>
          </div>
        </div>
      </div>

      <form id="contactForm">
        <div class="form-row">
          <div class="form-group">
            <label for="nome" data-pt="Nome completo *" data-en="Full name *">Nome completo *</label>
            <input type="text" id="nome" name="nome" required>
          </div>
          <div class="form-group">
            <label for="email" data-pt="Email *" data-en="Email *">Email *</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contacto" data-pt="Contacto telefónico *" data-en="Phone number *">Contacto telefónico *</label>
            <input type="tel" id="contacto" name="contacto" required>
          </div>
          <div class="form-group">
            <label for="localizacao" data-pt="Bairro / Localização" data-en="Neighborhood / Location">Bairro / Localização</label>
            <input type="text" id="localizacao" name="localizacao">
          </div>
        </div>

        <!-- Níveis Cambridge -->
        <div class="form-group">
          <label for="nivel" data-pt="Nível de ensino *" data-en="Education level *">Nível de ensino *</label>
          <select id="nivel" name="nivel" required>
            <option value="" data-pt="Selecionar" data-en="Select">Selecionar</option>
            <option value="primary_checkpoint" data-pt="Primary Checkpoint (5-6)" data-en="Primary Checkpoint (5-6)">Primary Checkpoint (5-6)</option>
            <option value="lower_secondary" data-pt="Lower Secondary Checkpoint (7-9)" data-en="Lower Secondary Checkpoint (7-9)">Lower Secondary Checkpoint (7-9)</option>
            <option value="igcse" data-pt="IGCSE (10-11)" data-en="IGCSE (10-11)">IGCSE (10-11)</option>
            <option value="as_level" data-pt="AS Level (12)" data-en="AS Level (12)">AS Level (12)</option>
            <option value="a_level" data-pt="A Level (13)" data-en="A Level (13)">A Level (13)</option>
          </select>
        </div>

        <!-- Tipo de aula: Presencial ou Domicílio -->
        <div class="form-group">
          <label data-pt="Tipo de aula" data-en="Lesson type">Tipo de aula</label>
          <div class="type-options">
            <label class="type-option">
              <input type="radio" name="tipoAula" value="presencial" checked>
              <span data-pt="Presencial" data-en="In-person">Presencial</span>
            </label>
            <label class="type-option">
              <input type="radio" name="tipoAula" value="domicilio">
              <span data-pt="Ao domicílio (+500 MT)" data-en="Home tutoring (+500 MTZ)">Ao domicílio (+500 MT)</span>
            </label>
          </div>
        </div>

        <!-- Pacote de aulas (dias por semana) com preços base (presencial) -->
        <div class="form-group">
          <label data-pt="Pacote de aulas (dias por semana)" data-en="Lesson package (days per week)">Pacote de aulas (dias por semana)</label>
          <div class="package-options">
            <label class="package-option">
              <input type="radio" name="pacote" value="2dias" data-preco-base="2000">
              <span class="package-name" data-pt="2 dias / semana" data-en="2 days / week">2 dias / semana</span>
              <span class="package-price" data-preco-base="2000">2000 MT</span>
            </label>
            <label class="package-option">
              <input type="radio" name="pacote" value="3dias" data-preco-base="3000">
              <span class="package-name" data-pt="3 dias / semana" data-en="3 days / week">3 dias / semana</span>
              <span class="package-price" data-preco-base="3000">3000 MT</span>
            </label>
            <label class="package-option">
              <input type="radio" name="pacote" value="4dias" data-preco-base="4000">
              <span class="package-name" data-pt="4 dias / semana" data-en="4 days / week">4 dias / semana</span>
              <span class="package-price" data-preco-base="4000">4000 MT</span>
            </label>
          </div>
        </div>

        <!-- Dias da semana preferenciais -->
        <div class="form-group">
          <label data-pt="Dias da semana preferenciais" data-en="Preferred weekdays">Dias da semana preferenciais</label>
          <div class="weekdays-options">
            <label class="weekday-option"><input type="checkbox" name="dias" value="Segunda"> <span data-pt="Segunda" data-en="Monday">Segunda</span></label>
            <label class="weekday-option"><input type="checkbox" name="dias" value="Terça"> <span data-pt="Terça" data-en="Tuesday">Terça</span></label>
            <label class="weekday-option"><input type="checkbox" name="dias" value="Quarta"> <span data-pt="Quarta" data-en="Wednesday">Quarta</span></label>
            <label class="weekday-option"><input type="checkbox" name="dias" value="Quinta"> <span data-pt="Quinta" data-en="Thursday">Quinta</span></label>
            <label class="weekday-option"><input type="checkbox" name="dias" value="Sexta"> <span data-pt="Sexta" data-en="Friday">Sexta</span></label>
            <label class="weekday-option"><input type="checkbox" name="dias" value="Sábado"> <span data-pt="Sábado" data-en="Saturday">Sábado</span></label>
          </div>
        </div>

        <!-- Horário preferencial (novos horários) -->
        <div class="form-group">
          <label for="horario" data-pt="Horário preferencial" data-en="Preferred time">Horário preferencial</label>
          <select id="horario" name="horario">
            <option value="" data-pt="Selecionar" data-en="Select">Selecionar</option>
            <option value="8h-9h30" data-pt="8:00 – 9:30" data-en="8:00 – 9:30">8:00 – 9:30</option>
            <option value="10h-11h30" data-pt="10:00 – 11:30" data-en="10:00 – 11:30">10:00 – 11:30</option>
            <option value="12h-13h30" data-pt="12:00 – 13:30" data-en="12:00 – 13:30">12:00 – 13:30</option>
            <option value="14h-15h30" data-pt="14:00 – 15:30" data-en="14:00 – 15:30">14:00 – 15:30</option>
            <option value="16h-17h30" data-pt="16:00 – 17:30" data-en="16:00 – 17:30">16:00 – 17:30</option>
            <option value="18h-19h30" data-pt="18:00 – 19:30" data-en="18:00 – 19:30">18:00 – 19:30</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dificuldade" data-pt="Dificuldades / Observações" data-en="Difficulties / Observations">Dificuldades / Observações</label>
          <textarea id="dificuldade" name="dificuldade" rows="2"></textarea>
        </div>

        <div class="total-container">
          <span data-pt="Total estimado:" data-en="Estimated total:">Total estimado:</span>
          <strong id="totalValor">0</strong> <span>MZN</span>
        </div>

        <div id="alertMessage" class="alert-message" style="display: none;"></div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <i class="fas fa-chalkboard-user"></i> <span data-pt="Solicitar explicador/professor" data-en="Request tutor/teacher">Solicitar explicador/professor</span>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="JavaScript/FichaAluno.js"></script>
</body>
</html>
